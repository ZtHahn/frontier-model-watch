name: Frontier Model Watch

on:
  schedule:
    - cron: "23 */2 * * *"   # every 2 hours
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message to Telegram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: model-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check for new models
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TEST_MODE: ${{ github.event.inputs.test || 'false' }}
        run: python check_releases.py
      - name: Save what we've seen
        run: |
          git config user.name "model-watch-bot"
          git config user.email "model-watch-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen releases" && git push)
